# Blueprint do Render (https://render.com) — API do Víamos (item #45/#46: deploy em nuvem com HTTPS).
# Passos: Render → New → Blueprint → apontar para este repositório. O banco pode ser o Postgres do próprio
# Render (abaixo) ou um Neon (https://neon.tech); nesse caso remova a seção `databases` e cole a URL em DATABASE_URL.
services:
  - type: web
    name: viamos-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: viamos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGINS
        value: https://viamos.vercel.app # ajuste para o domínio real do frontend na Vercel
      - key: API_PUBLIC_URL
        value: https://viamos-api.onrender.com # ajuste para a URL gerada pelo Render
      - key: FRONTEND_URL
        value: https://viamos.vercel.app

databases:
  - name: viamos-db
    plan: free
    databaseName: viamos
    user: viamos
