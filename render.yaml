# Blueprint do Render (https://render.com) — API do Víamos (item #45/#46: deploy em nuvem com HTTPS).
# Render → New → Blueprint → apontar para este repositório para usar o Postgres do Render.
# Para Neon, configure um Web Service manualmente como descrito em docs/DEPLOY.md.
services:
  - type: web
    name: viamos-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22.23.1'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: viamos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: viamos-db
    plan: free
    databaseName: viamos
    user: viamos
