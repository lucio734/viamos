<text x="88.0" y="687.3333333333334" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#1a2e44" text-anchor="middle">Víamos</text>
<ellipse cx="171.0" cy="256.0" rx="16.0" ry="16.0" fill="white" stroke="#1a2e44" stroke-width="1.8"/>
<rect x="230" y="220" width="180" height="70" rx="15" fill="#edf4f8" stroke="#1a2e44" stroke-width="1.8"/>
<text x="320.0" y="241.7" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">Alinhar encontro;</text>
<text x="320.0" y="259.9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">exibir QR ao</text>
<text x="320.0" y="278.09999999999997" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">intérprete</text>
