<text x="1285.0" y="460.8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">Confirmar</text>
<text x="1285.0" y="479.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">encerramento</text>
<rect x="1200" y="650" width="170" height="70" rx="15" fill="#edf4f8" stroke="#1a2e44" stroke-width="1.8"/>
<text x="1285.0" y="680.8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">Registrar fim e</text>
<text x="1285.0" y="699.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">duração; liberar pós</text>
