<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">BPMN | encontro, check-in e encerramento</title><rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="1440" height="12" rx="0" fill="#1a2e44" stroke="#1a2e44" stroke-width="1.8"/>
<text x="48" y="47.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#087e8b" text-anchor="start">VÍAMOS / MODELAGEM DE SISTEMAS</text>
<text x="48" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1a2e44" text-anchor="start">BPMN | encontro, check-in e encerramento</text>
<text x="48" y="125.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#213547" text-anchor="start">Pré-condição: solicitação aceita e participantes autenticados.</text>
<polyline points="48,145 1392,145" fill="none" stroke="#cbd5df" stroke-width="1"/>
<text x="48" y="847.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#087e8b" text-anchor="start">JUSTIFICATIVA E REGRAS</text>
<text x="48" y="874.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">O cliente exibe o QR e o intérprete faz a leitura. Validar vínculo, QR, distância até 200 m e precisão até 50 m impede início indevido. Falha mantém o estado “Aceita”. O</text>
<text x="48" y="893.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">encerramento registra duração real, para a localização e libera pagamento, comprovante e avaliação de forma independente.</text>
<text x="48" y="950.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#526578" text-anchor="start">RF28–RF34, RF37–RF40; RNF21, RNF26, RNF44; US10, US20–US21. Suporte registrado em P3 não encerra automaticamente o atendimento.</text>
<rect x="48" y="165.0" width="1344" height="213.33333333333334" rx="0" fill="#f5f8fa" stroke="#b7c7d3" stroke-width="1.8"/>
<rect x="48" y="165.0" width="80" height="213.33333333333334" rx="0" fill="#edf4f8" stroke="#b7c7d3" stroke-width="1.8"/>
<text x="88.0" y="260.6666666666667" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#1a2e44" text-anchor="middle">Cliente</text>
