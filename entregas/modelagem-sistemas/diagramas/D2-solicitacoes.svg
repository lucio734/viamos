<text x="48" y="847.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#087e8b" text-anchor="start">JUSTIFICATIVA E REGRAS</text>
<text x="48" y="874.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">D2 registra a busca, o vínculo exclusivo e a disponibilidade. A seleção combina habilitação em D1, agenda em D2 e reputação em D5. A recusa é individual. Cancelamento</text>
<text x="48" y="893.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">valida a política antes de alterar D2. A fórmula de estimativa não é inventada; é uma regra de negócio ainda a detalhar.</text>
<text x="48" y="950.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#526578" text-anchor="start">RF10–RF25; RNF03, RNF24, RNF27, RNF36, RNF43. Relação com BPMN B2, B3 e B6; estados em E1.</text>
