<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">Rastreabilidade | cobertura funcional</title><rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="1440" height="12" rx="0" fill="#1a2e44" stroke="#1a2e44" stroke-width="1.8"/>
<text x="48" y="47.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#087e8b" text-anchor="start">VÍAMOS / MODELAGEM DE SISTEMAS</text>
<text x="48" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1a2e44" text-anchor="start">Rastreabilidade | cobertura funcional</text>
<text x="48" y="125.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#213547" text-anchor="start">Os grupos abaixo cobrem RF01–RF45 sem alterar os identificadores das entregas originais.</text>
<polyline points="48,145 1392,145" fill="none" stroke="#cbd5df" stroke-width="1"/>
<rect x="48" y="185" width="1344" height="63" rx="0" fill="#edf4f8" stroke="#d7e2ea" stroke-width="1.8"/>
<text x="65" y="222.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1a2e44" text-anchor="start">RF01–RF09</text>
<text x="255" y="222.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="start">Identidade, cadastro, certificação e acesso</text>
<text x="1030" y="221.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#087e8b" text-anchor="start">C1/C2 · B1 · P1</text>
<rect x="48" y="255" width="1344" height="63" rx="0" fill="white" stroke="#d7e2ea" stroke-width="1.8"/>
<text x="65" y="292.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1a2e44" text-anchor="start">RF10–RF16</text>
<text x="255" y="292.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="start">Solicitação, local, duração e cotação</text>
<text x="1030" y="291.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#087e8b" text-anchor="start">C1/C2 · B2 · P2 · E1</text>
<rect x="48" y="325" width="1344" height="63" rx="0" fill="#edf4f8" stroke="#d7e2ea" stroke-width="1.8"/>
<text x="65" y="362.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1a2e44" text-anchor="start">RF17–RF25</text>
<text x="255" y="362.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="start">Distribuição, status, cancelamento e agenda</text>
<text x="1030" y="361.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#087e8b" text-anchor="start">C1 · B3/B6 · P2 · E1</text>
<rect x="48" y="395" width="1344" height="63" rx="0" fill="white" stroke="#d7e2ea" stroke-width="1.8"/>
<text x="65" y="432.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1a2e44" text-anchor="start">RF26–RF27</text>
<text x="255" y="432.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="start">Ganhos, saldo e repasse</text>
<text x="1030" y="431.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#087e8b" text-anchor="start">C1/C2 · P4</text>
<rect x="48" y="465" width="1344" height="63" rx="0" fill="#edf4f8" stroke="#d7e2ea" stroke-width="1.8"/>
<text x="65" y="502.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1a2e44" text-anchor="start">RF28–RF34</text>
<text x="255" y="502.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="start">Comunicação, check-in, encerramento e suporte</text>
<text x="1030" y="501.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#087e8b" text-anchor="start">C1/C2 · B4 · P3 · E1</text>
<rect x="48" y="535" width="1344" height="63" rx="0" fill="white" stroke="#d7e2ea" stroke-width="1.8"/>
<text x="65" y="572.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1a2e44" text-anchor="start">RF35–RF36</text>
<text x="255" y="572.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="start">Forma de pagamento e cobrança</text>
<text x="1030" y="571.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#087e8b" text-anchor="start">C1/C2 · B5 · P4</text>
<rect x="48" y="605" width="1344" height="63" rx="0" fill="#edf4f8" stroke="#d7e2ea" stroke-width="1.8"/>
<text x="65" y="642.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1a2e44" text-anchor="start">RF37–RF41</text>
<text x="255" y="642.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="start">Comprovante, histórico e avaliação bilateral</text>
<text x="1030" y="641.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#087e8b" text-anchor="start">C1 · P5</text>
<rect x="48" y="675" width="1344" height="63" rx="0" fill="white" stroke="#d7e2ea" stroke-width="1.8"/>
<text x="65" y="712.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1a2e44" text-anchor="start">RF42–RF45</text>
<text x="255" y="712.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="start">Notificações, perfil, auditoria e privacidade</text>
<text x="1030" y="711.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#087e8b" text-anchor="start">C1/C2 · P6</text>
<text x="55" y="787.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="start">RF09 (splash) é uma apresentação do carregamento/sessão em P1, não um processo externo. RNFs de desempenho, acessibilidade, segurança e</text>
<text x="55" y="809.1" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="start">disponibilidade são restrições; estes modelos não demonstram que suas metas foram implementadas ou medidas.</text>
