<text x="48" y="47.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#087e8b" text-anchor="start">VÍAMOS / MODELAGEM DE SISTEMAS</text>
<text x="48" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1a2e44" text-anchor="start">DFD | P4 — pagamento, ganhos e repasse</text>
<text x="48" y="125.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#213547" text-anchor="start">DFD lógico de nível 1 • vista 4/6 • o estado financeiro é independente do estado operacional.</text>
<polyline points="48,145 1392,145" fill="none" stroke="#cbd5df" stroke-width="1"/>
<text x="48" y="847.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#087e8b" text-anchor="start">JUSTIFICATIVA E REGRAS</text>
<text x="48" y="874.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">O valor final deriva de registros do serviço e da política de cobrança. O gateway retorna um resultado, que gera lançamento financeiro sem duplicação. Repasse reserva saldo</text>
<text x="48" y="893.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">disponível e registra resultado. Cartão bruto não persiste em D4: a tokenização ocorre pelo gateway. Provedor e fórmula de preço não foram definidos.</text>
<text x="48" y="950.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#526578" text-anchor="start">RF26–RF27, RF35–RF36; RNF23, RNF37; US11, US22–US23; UML DC7–DC8. BPMN B5.</text>
