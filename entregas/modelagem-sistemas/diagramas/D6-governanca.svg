<text x="48" y="47.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#087e8b" text-anchor="start">VÍAMOS / MODELAGEM DE SISTEMAS</text>
<text x="48" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1a2e44" text-anchor="start">DFD | P6 — privacidade, auditoria e notificações</text>
<text x="48" y="125.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#213547" text-anchor="start">DFD lógico de nível 1 • vista 6/6 • operações transversais preservam identificação e finalidade.</text>
<polyline points="48,145 1392,145" fill="none" stroke="#cbd5df" stroke-width="1"/>
<text x="48" y="847.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#087e8b" text-anchor="start">JUSTIFICATIVA E REGRAS</text>
<text x="48" y="874.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">P6 registra pedidos de exportação/exclusão e coordena o tratamento pelos módulos proprietários dos dados. A retenção de atendimento por cinco anos e a auditoria por seis</text>
<text x="48" y="893.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">meses exigem política específica: um pedido não equivale a apagar imediatamente todos os registros. Push é transporte; D6 mantém o resultado.</text>
<text x="48" y="950.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#526578" text-anchor="start">RF42–RF45; RNF09, RNF25, RNF29, RNF33, RNF44. Leituras/tratamentos LGPD complementam P1–P5; consultar a matriz de fluxos.</text>
