<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">DFD | P1 — identidade, acesso e certificação</title><rect width="100%" height="100%" fill="white"/>
