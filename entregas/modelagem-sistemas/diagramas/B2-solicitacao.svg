<rect x="48" y="485.0" width="80" height="320.0" rx="0" fill="#edf4f8" stroke="#b7c7d3" stroke-width="1.8"/>
<text x="88.0" y="634.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#1a2e44" text-anchor="middle">Víamos</text>
