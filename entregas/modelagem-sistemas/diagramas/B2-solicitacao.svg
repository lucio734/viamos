<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">BPMN | criar e confirmar solicitação</title><rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="1440" height="12" rx="0" fill="#1a2e44" stroke="#1a2e44" stroke-width="1.8"/>
<text x="48" y="47.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#087e8b" text-anchor="start">VÍAMOS / MODELAGEM DE SISTEMAS</text>
<text x="48" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1a2e44" text-anchor="start">BPMN | criar e confirmar solicitação</text>
<text x="48" y="125.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#213547" text-anchor="start">Pré-condição: cliente autenticado. Saída: solicitação no estado “Buscando intérprete”.</text>
<polyline points="48,145 1392,145" fill="none" stroke="#cbd5df" stroke-width="1"/>
<text x="48" y="847.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#087e8b" text-anchor="start">JUSTIFICATIVA E REGRAS</text>
<text x="48" y="874.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">A estimativa antecede a confirmação. Data/hora passada, duração inferior a 60 min ou endereço inválido retornam ao preenchimento. O registro só ocorre com confirmação do</text>
<text x="48" y="893.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">cliente; a desistência antes disso não cria solicitação cancelada. Fórmula de preço permanece parametrizável, pois não está definida nas fontes.</text>
<text x="48" y="950.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#526578" text-anchor="start">RF10–RF16; RNF24, RNF28; US05–US07. A distribuição continua na vista B3.</text>
<rect x="48" y="165.0" width="1344" height="320.0" rx="0" fill="#f5f8fa" stroke="#b7c7d3" stroke-width="1.8"/>
