<text x="902.0" y="551.7" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">Calcular e</text>
<text x="902.0" y="569.9000000000001" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">apresentar</text>
