<rect x="240" y="250" width="164" height="70" rx="15" fill="#edf4f8" stroke="#1a2e44" stroke-width="1.8"/>
<text x="322.0" y="271.7" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">Informar serviço,</text>
<text x="322.0" y="289.9" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">data, duração e</text>
<text x="322.0" y="308.09999999999997" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">local</text>
<rect x="445" y="530" width="164" height="70" rx="15" fill="#edf4f8" stroke="#1a2e44" stroke-width="1.8"/>
<text x="527.0" y="560.8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">Validar dados e</text>
<text x="527.0" y="579.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">geocodificar local</text>
