<text x="55" y="518.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#213547" text-anchor="start">Víamos</text>
<rect x="220" y="720" width="710" height="80" rx="0" fill="#edf4f8" stroke="#1a2e44" stroke-width="1.8"/>
<text x="575.0" y="765.95" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#213547" text-anchor="middle">Gateway financeiro — pool externo (processamento não detalhado)</text>
