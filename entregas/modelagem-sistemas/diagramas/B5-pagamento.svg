<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">BPMN | cobrança e tratamento de falha</title><rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="1440" height="12" rx="0" fill="#1a2e44" stroke="#1a2e44" stroke-width="1.8"/>
<text x="48" y="47.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#087e8b" text-anchor="start">VÍAMOS / MODELAGEM DE SISTEMAS</text>
<text x="48" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1a2e44" text-anchor="start">BPMN | cobrança e tratamento de falha</text>
<text x="48" y="125.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#213547" text-anchor="start">Pré-condição: atendimento concluído. O gateway é um participante externo, em pool separado.</text>
<polyline points="48,145 1392,145" fill="none" stroke="#cbd5df" stroke-width="1"/>
<text x="48" y="847.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#087e8b" text-anchor="start">JUSTIFICATIVA E REGRAS</text>
<text x="48" y="874.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">A requisição e o retorno do gateway são fluxos de mensagem (tracejados), nunca sequência entre pools. Pagamento aprovado gera crédito uma única vez; falha permite nova</text>
<text x="48" y="893.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">tentativa. A conclusão do atendimento e a emissão do comprovante não são desfeitas por falha financeira. Repasses e saldo são detalhados em P4.</text>
<text x="48" y="950.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#526578" text-anchor="start">RF26–RF27, RF35–RF38; RNF23, RNF37; US11, US22–US23; UML DC7–DC8. Gateway externo mostrado como pool caixa-preta.</text>
<rect x="48" y="165" width="1344" height="510" rx="0" fill="white" stroke="#b7c7d3" stroke-width="1.8"/>
<rect x="48" y="165" width="1344" height="220" rx="0" fill="#f5f8fa" stroke="#b7c7d3" stroke-width="1.8"/>
