<text x="307.5" y="345.8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">entry / distribuir demanda</text>
<text x="307.5" y="364.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">recusa / manter oferta</text>
<text x="307.5" y="382.20000000000005" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#213547" text-anchor="middle">sem elegíveis / aguardar</text>
