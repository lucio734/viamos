<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">Máquina de estados | solicitação e atendimento associado</title><rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="1440" height="12" rx="0" fill="#1a2e44" stroke="#1a2e44" stroke-width="1.8"/>
<text x="48" y="47.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#087e8b" text-anchor="start">VÍAMOS / MODELAGEM DE SISTEMAS</text>
<text x="48" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1a2e44" text-anchor="start">Máquina de estados | solicitação e atendimento associado</text>
<text x="48" y="125.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#213547" text-anchor="start">UML • evento [guarda] / ação • estados de RF18; pagamento possui ciclo próprio.</text>
<polyline points="48,145 1392,145" fill="none" stroke="#cbd5df" stroke-width="1"/>
<text x="48" y="847.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#087e8b" text-anchor="start">JUSTIFICATIVA E REGRAS</text>
<text x="48" y="874.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">A criação acontece somente após confirmar o resumo. Recusa e ausência de elegíveis mantêm a busca. O aceite exclusivo cria o vínculo; só check-in válido inicia. O</text>
<text x="48" y="893.5" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#213547" text-anchor="start">encerramento conclui o serviço mesmo se a cobrança falhar. Cancelamento antes do início é sujeito à política; nenhum prazo de expiração ou estado de falta foi inventado.</text>
<text x="48" y="950.0" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#526578" text-anchor="start">RF16–RF19, RF22–RF23, RF31–RF33; RNF26, RNF27, RNF36; US09. Setas rotuladas são transições; pontos pretos = início/fim.</text>
<text x="560" y="201.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#213547" text-anchor="start">Eventos descritos dentro do estado são internos: não saem do estado nem repetem ações entry.</text>
<text x="560" y="221.8" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#213547" text-anchor="start">Assim, suporte não reinicia o relógio e QR inválido não refaz o aceite.</text>
<ellipse cx="87.0" cy="342.0" rx="12.0" ry="12.0" fill="#1a2e44" stroke="#1a2e44" stroke-width="1.8"/>
