<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Cadastro - Víamos</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS with custom config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#5d5f5f",
                        "on-primary-fixed": "#061d32",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f5f3f5",
                        "inverse-primary": "#b4c8e4",
                        "on-tertiary-fixed-variant": "#5a431f",
                        "on-secondary-fixed": "#1a1c1c",
                        "background-alt": "#F8FAFC",
                        "on-surface-variant": "#43474d",
                        "surface-variant": "#e4e2e4",
                        "inverse-on-surface": "#f2f0f2",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffddb0",
                        "outline-variant": "#c4c6cd",
                        "on-background": "#1b1c1d",
                        "surface": "#fbf9fb",
                        "secondary-fixed-dim": "#c6c6c7",
                        "secondary-container": "#dfe0e0",
                        "primary-fixed": "#d1e4ff",
                        "on-tertiary-container": "#ae8f64",
                        "on-primary-fixed-variant": "#35485f",
                        "inverse-surface": "#303032",
                        "outline": "#74777d",
                        "on-secondary-container": "#616363",
                        "on-surface": "#1b1c1d",
                        "tertiary": "#241500",
                        "surface-tint": "#4c6078",
                        "status-online": "#2D6A4F",
                        "surface-container-high": "#e9e7ea",
                        "on-secondary-fixed-variant": "#454747",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#e3c193",
                        "primary-fixed-dim": "#b4c8e4",
                        "error-container": "#ffdad6",
                        "surface-bright": "#fbf9fb",
                        "error": "#ba1a1a",
                        "surface-container": "#efedef",
                        "status-alert": "#D90429",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e4e2e4",
                        "primary-container": "#1a2e44",
                        "on-tertiary-fixed": "#281800",
                        "surface-container-lowest": "#ffffff",
                        "background": "#fbf9fb",
                        "on-tertiary": "#ffffff",
                        "primary": "#03192e",
                        "on-primary-container": "#8296b0",
                        "pro-verification": "#FFB703",
                        "secondary-fixed": "#e2e2e2",
                        "surface-dim": "#dbd9db",
                        "tertiary-container": "#3d2907"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "touch-target": "44px",
                        "unit": "8px",
                        "margin-mobile": "20px",
                        "margin-desktop": "48px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "body-base": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "mobile-headline": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-base": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "mobile-headline": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Base Google Font Import */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" data-snapdom="injected-import"></head>
<body class="bg-background-alt text-on-background font-body-base antialiased min-h-screen flex flex-col">
<!-- Transactional Header (Suppressed Main Nav Shell) -->
<header class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-[72px] bg-surface w-full shadow-sm z-10 sticky top-0">
<a aria-label="Voltar" class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors flex items-center justify-center h-touch-target w-touch-target" href="#">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</a>
<h1 class="font-display-lg text-mobile-headline font-bold text-primary tracking-tight">Víamos</h1>
<div class="w-touch-target"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-margin-mobile md:px-margin-desktop py-8 md:py-12 w-full max-w-[600px] mx-auto">
<div class="w-full text-left mb-8">
<h2 class="font-headline-md text-headline-md text-primary mb-2">Crie sua conta</h2>
<p class="font-body-base text-body-base text-on-surface-variant">Preencha seus dados pessoais para ter acesso a intérpretes de Libras de forma rápida e segura.</p>
</div>
<form action="#" class="w-full flex flex-col gap-6" method="POST">
<!-- Personal Data Section -->
<fieldset class="flex flex-col gap-6 bg-surface p-6 rounded-xl shadow-sm border border-surface-container-low">
<legend class="sr-only">Dados Pessoais</legend>
<div class="flex flex-col gap-unit w-full">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="nome">Nome Completo</label>
<input class="border border-outline bg-surface-container-lowest text-on-surface rounded-lg p-3 min-h-[48px] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-base text-body-base w-full transition-shadow" id="nome" name="nome" placeholder="Digite seu nome completo" required="" type="text">
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
<div class="flex flex-col gap-unit w-full">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="cpf">CPF</label>
<input class="border border-outline bg-surface-container-lowest text-on-surface rounded-lg p-3 min-h-[48px] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-base text-body-base w-full transition-shadow" id="cpf" inputmode="numeric" name="cpf" placeholder="000.000.000-00" required="" type="text">
</div>
<div class="flex flex-col gap-unit w-full">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="nascimento">Data de Nascimento</label>
<input class="border border-outline bg-surface-container-lowest text-on-surface rounded-lg p-3 min-h-[48px] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-base text-body-base w-full transition-shadow" id="nascimento" name="nascimento" required="" type="date">
</div>
</div>
</fieldset>
<!-- Address Section -->
<fieldset class="flex flex-col gap-6 bg-surface p-6 rounded-xl shadow-sm border border-surface-container-low">
<legend class="sr-only">Endereço</legend>
<div class="flex flex-col gap-unit w-full">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="cep">CEP</label>
<div class="relative">
<input class="border border-outline bg-surface-container-lowest text-on-surface rounded-lg p-3 min-h-[48px] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-base text-body-base w-full transition-shadow pr-12" id="cep" inputmode="numeric" name="cep" placeholder="00000-000" required="" type="text">
<button aria-label="Buscar CEP" class="absolute right-2 top-1/2 -translate-y-1/2 text-primary hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</div>
</div>
<div class="flex flex-col gap-unit w-full">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="complemento">Complemento <span class="normal-case text-outline text-sm font-normal">(Opcional)</span></label>
<input class="border border-outline bg-surface-container-lowest text-on-surface rounded-lg p-3 min-h-[48px] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-base text-body-base w-full transition-shadow" id="complemento" name="complemento" placeholder="Apto, Bloco, Casa 2, etc." type="text">
</div>
</fieldset>
<!-- Account Credentials Section -->
<fieldset class="flex flex-col gap-6 bg-surface p-6 rounded-xl shadow-sm border border-surface-container-low">
<legend class="sr-only">Dados de Acesso</legend>
<div class="flex flex-col gap-unit w-full">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">E-mail</label>
<input class="border border-outline bg-surface-container-lowest text-on-surface rounded-lg p-3 min-h-[48px] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-base text-body-base w-full transition-shadow" id="email" name="email" placeholder="seu@email.com" required="" type="email">
</div>
<div class="flex flex-col gap-unit w-full">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="senha">Senha</label>
<div class="relative">
<input class="border border-outline bg-surface-container-lowest text-on-surface rounded-lg p-3 min-h-[48px] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-base text-body-base w-full transition-shadow pr-12" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required="" type="password">
<button aria-label="Mostrar senha" class="absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</fieldset>
<!-- Actions -->
<div class="mt-4 flex flex-col gap-4">
<button class="bg-primary-container text-on-primary font-headline-md text-body-base font-semibold py-3 px-6 rounded-full w-full h-touch-target flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all shadow-md" type="submit">
                    Cadastrar
                </button>
<a class="bg-surface-container-lowest text-primary-container border border-primary-container font-headline-md text-body-base font-semibold py-3 px-6 rounded-full w-full h-touch-target flex items-center justify-center hover:bg-surface-container-low active:scale-[0.98] transition-all" href="#">
                    Já tem uma conta? Voltar ao login
                </a>
</div>
</form>
</main>
</body></html>
