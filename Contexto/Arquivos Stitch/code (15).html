<!DOCTYPE html><html class="light" lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Nova Solicitação</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#616363",
                        "on-secondary-fixed": "#1a1c1c",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffddb0",
                        "surface-container-high": "#e9e7ea",
                        "status-alert": "#D90429",
                        "tertiary-container": "#3d2907",
                        "on-tertiary-fixed": "#281800",
                        "background": "#fbf9fb",
                        "on-primary-fixed-variant": "#35485f",
                        "background-alt": "#F8FAFC",
                        "on-background": "#1b1c1d",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#b4c8e4",
                        "inverse-surface": "#303032",
                        "surface-variant": "#e4e2e4",
                        "secondary-container": "#dfe0e0",
                        "outline-variant": "#c4c6cd",
                        "on-surface": "#1b1c1d",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e4e2e4",
                        "on-surface-variant": "#43474d",
                        "on-primary-container": "#8296b0",
                        "secondary": "#5d5f5f",
                        "secondary-fixed-dim": "#c6c6c7",
                        "inverse-primary": "#b4c8e4",
                        "surface-dim": "#dbd9db",
                        "primary-fixed": "#d1e4ff",
                        "pro-verification": "#FFB703",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#5a431f",
                        "on-secondary-fixed-variant": "#454747",
                        "status-online": "#2D6A4F",
                        "surface-bright": "#fbf9fb",
                        "surface": "#fbf9fb",
                        "tertiary-fixed-dim": "#e3c193",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f2f0f2",
                        "secondary-fixed": "#e2e2e2",
                        "primary": "#03192e",
                        "on-primary-fixed": "#061d32",
                        "surface-tint": "#4c6078",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#ae8f64",
                        "surface-container": "#efedef",
                        "tertiary": "#241500",
                        "primary-container": "#1a2e44",
                        "outline": "#74777d",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f5f3f5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "touch-target": "44px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "unit": "8px",
                        "margin-desktop": "48px"
                    },
                    "fontFamily": {
                        "mobile-headline": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-base": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "mobile-headline": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-base": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]

                }
            }
        }

<style>
        /* Hide scrollbar for clean UI but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .chip-radio:checked + label {
            background-color: theme('colors.primary-container');
            color: theme('colors.on-primary');
            border-color: theme('colors.primary-container');
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-base min-h-screen pb-24 md:pb-0 pt-[56px] md:pt-[72px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-sm flex justify-between items-center px-margin-mobile h-touch-target md:h-[72px] transition-transform duration-300">
<button aria-label="Voltar" class="text-primary dark:text-primary-fixed p-2 -ml-2 rounded-full hover:bg-surface-variant/50 transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-mobile-headline text-mobile-headline md:font-headline-md md:text-headline-md text-primary dark:text-primary-fixed absolute left-1/2 -translate-x-1/2">
            Nova Solicitação
        </h1>
<button aria-label="Perfil" class="text-primary dark:text-primary-fixed p-2 -mr-2 rounded-full hover:bg-surface-variant/50 transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</header>
<main class="max-w-2xl mx-auto px-margin-mobile md:px-margin-desktop py-gutter space-y-[24px]">
<!-- Section 1: Event Type -->
<section class="bg-surface-container-lowest p-gutter rounded-xl shadow-sm border border-surface-variant">
<h2 class="font-mobile-headline text-[18px] text-primary mb-unit flex items-center gap-2">
<span class="material-symbols-outlined text-outline">category</span>
                Tipo de Atendimento
            </h2>
<div class="flex flex-wrap gap-2 mt-3">
<div>
<input checked="" class="hidden chip-radio" id="type_medico" name="event_type" type="radio">
<label class="inline-flex items-center justify-center px-4 py-2 border border-outline-variant rounded-full text-on-surface-variant cursor-pointer transition-all hover:bg-surface-variant/30 active:scale-95 h-touch-target" for="type_medico">
                        Médico
                    </label>
</div>
<div>
<input class="hidden chip-radio" id="type_educacao" name="event_type" type="radio">
<label class="inline-flex items-center justify-center px-4 py-2 border border-outline-variant rounded-full text-on-surface-variant cursor-pointer transition-all hover:bg-surface-variant/30 active:scale-95 h-touch-target" for="type_educacao">
                        Educação
                    </label>
</div>
<div>
<input class="hidden chip-radio" id="type_juridico" name="event_type" type="radio">
<label class="inline-flex items-center justify-center px-4 py-2 border border-outline-variant rounded-full text-on-surface-variant cursor-pointer transition-all hover:bg-surface-variant/30 active:scale-95 h-touch-target" for="type_juridico">
                        Jurídico
                    </label>
</div>
<div>
<input class="hidden chip-radio" id="type_palestra" name="event_type" type="radio">
<label class="inline-flex items-center justify-center px-4 py-2 border border-outline-variant rounded-full text-on-surface-variant cursor-pointer transition-all hover:bg-surface-variant/30 active:scale-95 h-touch-target" for="type_palestra">
                        Palestra
                    </label>
</div>
<div>
<input class="hidden chip-radio" id="type_outro" name="event_type" type="radio">
<label class="inline-flex items-center justify-center px-4 py-2 border border-outline-variant rounded-full text-on-surface-variant cursor-pointer transition-all hover:bg-surface-variant/30 active:scale-95 h-touch-target" for="type_outro">
                        Outro
                    </label>
</div>
</div>
</section>
<!-- Section 2: Date and Time -->
<section class="bg-surface-container-lowest p-gutter rounded-xl shadow-sm border border-surface-variant grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div>
<label class="block font-mobile-headline text-[16px] text-on-surface mb-unit flex items-center gap-2" for="date_picker">
<span class="material-symbols-outlined text-outline">calendar_month</span>
                    Data
                </label>
<div class="relative">
<input class="w-full h-touch-target rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-background text-on-background px-3" id="date_picker" required="" type="date">
</div>
</div>
<div>
<label class="block font-mobile-headline text-[16px] text-on-surface mb-unit flex items-center gap-2" for="time_picker">
<span class="material-symbols-outlined text-outline">schedule</span>
                    Horário de Início
                </label>
<div class="relative">
<input class="w-full h-touch-target rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-background text-on-background px-3" id="time_picker" required="" type="time">
</div>
</div>
</section>
<!-- Section 3: Duration -->
<section class="bg-surface-container-lowest p-gutter rounded-xl shadow-sm border border-surface-variant">
<h2 class="font-mobile-headline text-[18px] text-primary mb-unit flex items-center gap-2">
<span class="material-symbols-outlined text-outline">timer</span>
                Duração Estimada
            </h2>
<div class="flex flex-wrap gap-2 mt-3">
<div>
<input class="hidden chip-radio" id="dur_30m" name="duration" type="radio">
<label class="inline-flex items-center justify-center px-4 py-2 border border-outline-variant rounded-full text-on-surface-variant cursor-pointer transition-all hover:bg-surface-variant/30 active:scale-95 h-touch-target min-w-[80px]" for="dur_30m">
                        30 min
                    </label>
</div>
<div>
<input checked="" class="hidden chip-radio" id="dur_1h" name="duration" type="radio">
<label class="inline-flex items-center justify-center px-4 py-2 border border-outline-variant rounded-full text-on-surface-variant cursor-pointer transition-all hover:bg-surface-variant/30 active:scale-95 h-touch-target min-w-[80px]" for="dur_1h">
                        1 h
                    </label>
</div>
<div>
<input class="hidden chip-radio" id="dur_2h" name="duration" type="radio">
<label class="inline-flex items-center justify-center px-4 py-2 border border-outline-variant rounded-full text-on-surface-variant cursor-pointer transition-all hover:bg-surface-variant/30 active:scale-95 h-touch-target min-w-[80px]" for="dur_2h">
                        2 h
                    </label>
</div>
<div>
<input class="hidden chip-radio" id="dur_custom" name="duration" type="radio">
<label class="inline-flex items-center justify-center px-4 py-2 border border-outline-variant rounded-full text-on-surface-variant cursor-pointer transition-all hover:bg-surface-variant/30 active:scale-95 h-touch-target min-w-[80px]" for="dur_custom">
                        + de 2h
                    </label>
</div>
</div>
</section>
<!-- Section 4: Location -->
<section class="bg-surface-container-lowest p-gutter rounded-xl shadow-sm border border-surface-variant">
<h2 class="font-mobile-headline text-[18px] text-primary mb-unit flex items-center gap-2"><span class="material-symbols-outlined text-outline">location_on</span>
                Local do Atendimento</h2>

<div class="transition-all duration-300 opacity-100" id="address_field">
<label class="block font-body-base text-sm text-on-surface-variant mb-1" for="address_input">Endereço Completo</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">search</span>
</span>
<input class="w-full h-touch-target rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-background pl-10 text-on-background placeholder:text-outline-variant" id="address_input" placeholder="Rua, número, bairro..." type="text">
</div>
<!-- Map Placeholder -->
<div class="mt-3 w-full h-32 rounded-lg bg-surface-container overflow-hidden relative flex items-center justify-center border border-outline-variant/30">
<img class="w-full h-full object-cover opacity-70" data-alt="A clean, modern digital map interface centered on a specific address in a bright light-mode aesthetic. The map uses minimal details, pale grays, and soft blues for water bodies, with a distinct navy blue (brand primary) map pin marking a location. The UI feels professional, reliable, and accessible." data-location="São Paulo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAfOSAF7xTVU0xVuM5Cursz91AkN95EU7dkPmXsZWp0P0m-GbY98uENxrhWc9-ErzcTQJzms9xoAma9W0SW3LmDGgpfHkzzq4w17bmxEHdOmPrFEGxX56sltjR7FuYr-TLC19tsJtrNHATwk2Aro0nsQiQ8Z_7LfJ2m0wiykjLjE1DdgihlGhAuVFKnKbRwOuBWih3w_YMQa9a9e94Y3TP2QalsaXBhsbgHY9RoE0W3YC-yeRP0Cj2Qg">
<div class="absolute inset-0 bg-gradient-to-t from-surface/50 to-transparent"></div>
<span class="material-symbols-outlined absolute text-primary text-[32px] drop-shadow-md">location_on</span>
</div>
</div>
<div class="hidden transition-all duration-300 opacity-0" id="online_field">
<label class="block font-body-base text-sm text-on-surface-variant mb-1" for="link_input">Link da Reunião (Opcional)</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">link</span>
</span>
<input class="w-full h-touch-target rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-background pl-10 text-on-background placeholder:text-outline-variant" id="link_input" placeholder="https://zoom.us/j/..." type="url">
</div>
<p class="text-xs text-on-surface-variant mt-2 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">info</span>
                    Você pode adicionar o link depois.
                </p>
</div>
</section>
<!-- Section 5: Observations -->
<section class="bg-surface-container-lowest p-gutter rounded-xl shadow-sm border border-surface-variant mb-6">
<label class="block font-mobile-headline text-[18px] text-primary mb-unit flex items-center gap-2" for="observations">
<span class="material-symbols-outlined text-outline">notes</span>
                Observações
            </label>
<textarea class="w-full rounded-lg border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary bg-background text-on-background resize-none p-3" id="observations" placeholder="Ex: Preciso de intérprete com experiência na área médica..." rows="3"></textarea>
<p class="text-xs text-on-surface-variant mt-1 text-right">0/300</p>
</section>
</main>
<!-- Bottom Action Bar / CTA -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-surface-variant p-margin-mobile md:static md:bg-transparent md:border-none md:p-0 md:max-w-2xl md:mx-auto md:mb-12 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] md:shadow-none z-40">
<button class="w-full h-touch-target md:h-14 bg-primary-container text-on-primary font-mobile-headline text-[16px] rounded-lg shadow-md hover:bg-primary-fixed-variant active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="">Buscar Intérprete</span>
<span class="material-symbols-outlined text-[20px]">search</span>
</button>
</div>
<script>
        function toggleLocationField() {
            const isOnline = document.getElementById('loc_online').checked;
            const addressField = document.getElementById('address_field');
            const onlineField = document.getElementById('online_field');

            if (isOnline) {
                addressField.classList.add('hidden', 'opacity-0');
                addressField.classList.remove('opacity-100');
                
                onlineField.classList.remove('hidden');
                // slight delay for transition
                setTimeout(() => {
                    onlineField.classList.add('opacity-100');
                    onlineField.classList.remove('opacity-0');
                }, 10);
            } else {
                onlineField.classList.add('hidden', 'opacity-0');
                onlineField.classList.remove('opacity-100');
                
                addressField.classList.remove('hidden');
                // slight delay for transition
                setTimeout(() => {
                    addressField.classList.add('opacity-100');
                    addressField.classList.remove('opacity-0');
                }, 10);
            }
        }
    </script>


</body></html>
