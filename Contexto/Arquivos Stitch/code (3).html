<span class="material-symbols-outlined star text-[40px] text-outline-variant" data-value="2" data-weight="fill" style="font-variation-settings: 'FILL' 0;">star</span>
<span class="material-symbols-outlined star text-[40px] text-outline-variant" data-value="3" data-weight="fill" style="font-variation-settings: 'FILL' 0;">star</span>
<span class="material-symbols-outlined star text-[40px] text-outline-variant" data-value="4" data-weight="fill" style="font-variation-settings: 'FILL' 0;">star</span>
<span class="material-symbols-outlined star text-[40px] text-outline-variant" data-value="5" data-weight="fill" style="font-variation-settings: 'FILL' 0;">star</span>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('.star');
            const feedbackText = document.getElementById('rating-feedback');
            const feedbackMessages = [
                "Ruim", "Regular", "Bom", "Muito Bom", "Excelente"
            ];
            let currentRating = 0;

            function updateStars(rating) {
                stars.forEach((star, index) => {
                    if (index < rating) {
                        star.style.fontVariationSettings = "'FILL' 1";
                        star.classList.replace('text-outline-variant', 'text-pro-verification');
                    } else {
                        star.style.fontVariationSettings = "'FILL' 0";
                        star.classList.replace('text-pro-verification', 'text-outline-variant');
                    }
                });
            }

            stars.forEach((star, index) => {
                star.addEventListener('mouseover', () => {
                    updateStars(index + 1);
                });

                star.addEventListener('mouseout', () => {
                    updateStars(currentRating);
                });

                star.addEventListener('click', () => {
                    currentRating = index + 1;
                    updateStars(currentRating);
                    feedbackText.textContent = feedbackMessages[index];
                    feedbackText.classList.remove('opacity-0');
                    feedbackText.classList.add('opacity-100');
                    
                    // Small animation effect on click
                    star.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        star.style.transform = 'scale(1)';
                    }, 150);
                });
            });
        });
    </script>
