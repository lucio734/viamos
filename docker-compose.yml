# Banco de dados local para desenvolvimento.
# Uso: docker compose up -d   (depois: cd backend && npm run db:migrate && npm run db:seed)
# Alternativa sem Docker: criar um banco gratuito no Neon (https://neon.tech) e colar a URL no backend/.env
services:
  postgres:
    image: postgres:16-alpine
    container_name: viamos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: viamos
      POSTGRES_PASSWORD: viamos
      POSTGRES_DB: viamos
    ports:
      - "5432:5432"
    volumes:
      - viamos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viamos -d viamos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  viamos_pgdata:
