<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background-alt text-on-background font-body-base min-h-screen flex flex-col justify-center items-center p-gutter">
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-md p-margin-mobile flex flex-col gap-6">
<header class="text-center mb-4">
<div class="flex justify-center mb-4">
<span class="material-symbols-outlined text-primary" style="font-size: 48px; font-variation-settings: 'FILL' 1;">sign_language</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary">Víamos</h1>
<p class="font-body-base text-body-base text-on-surface-variant mt-2">Acessibilidade que começa com você.</p>
</header>
<form class="flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="font-mobile-headline text-mobile-headline text-on-surface" for="email">E-mail</label>
<input class="w-full h-touch-target px-4 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary bg-surface outline-none transition-colors" id="email" name="email" placeholder="Seu e-mail cadastrado" required="" type="email">
</div>
<div class="flex flex-col gap-2">
<label class="font-mobile-headline text-mobile-headline text-on-surface" for="password">Senha</label>
<div class="relative">
<input class="w-full h-touch-target px-4 pr-12 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary bg-surface outline-none transition-colors" id="password" name="password" placeholder="Sua senha" required="" type="password">
<button aria-label="Mostrar senha" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-outline-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="text-sm text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary rounded" href="#">Esqueceu a senha?</a>
</div>
</div>
<button class="w-full h-touch-target bg-primary-container text-on-primary font-mobile-headline text-mobile-headline rounded-lg hover:opacity-90 transition-opacity flex justify-center items-center shadow-sm" type="submit">
                Entrar
            </button>
</form>
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-surface-container-high"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-body-base text-sm">ou</span>
<div class="flex-grow border-t border-surface-container-high"></div>
</div>
<button class="w-full h-touch-target bg-surface-container-lowest text-primary border border-primary font-mobile-headline text-mobile-headline rounded-lg hover:bg-surface-container-low transition-colors flex justify-center items-center" type="button">
            Criar Nova Conta
        </button>
</main>
<footer class="mt-8 text-center text-on-surface-variant font-label-caps text-label-caps">
<p>Víamos. Acessibilidade simplificada.</p>
</footer>
</body></html>
